[package]
name = "player-proto"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ash = { version = "0.38", features = ["loaded"] }
ash-window = "0.13"
raw-window-handle = "0.6"
winit = "0.30"
gpu-allocator = { version = "0.27", default-features = false, features = [
  "vulkan",
] }
cosmic-text = "0.14"
# Rasterisation goes straight to swash instead of through cosmic-text's SwashCache: that cache
# hints against a fractional font size and bakes a quarter-pixel phase into every bitmap, and
# this UI needs the other arrangement (whole-pixel ppem, no phase, hinting on demand). Same
# version and features cosmic-text already pulls in, so cargo keeps a single copy.
swash = { version = "0.2", default-features = false, features = [
  "render",
  "scale",
  "std",
] }
libc = "0.2"
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
