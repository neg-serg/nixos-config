[package]
name = "player-proto"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ash = { version = "0.38", features = ["loaded"] }
ash-window = "0.13"
raw-window-handle = "0.6"
winit = "0.30"
gpu-allocator = { version = "0.27", default-features = false, features = [
  "vulkan",
] }
cosmic-text = "0.14"
libc = "0.2"
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
