# CamillaDSP insert: PipeWire in, PipeWire out.
#
# Both ends are the ALSA `pipewire` PCM, i.e. two ordinary PipeWire streams.
# `camilladsp-route` wires those streams between the game-stereo loopback and
# the RME AES pair (see modules/hardware/audio/dsp.nix), so the two device
# names below are the contract the router matches on: point either end at
# another device and the insert stops carrying audio while the router falls
# back to the direct loopback -> RME path.
#
# The main fader needs no filter: CamillaDSP 4 applies it to the whole pipeline
# (`SetVolume` from camillagui or aurora's camilla tab), so this passthrough is
# already level-controllable. Room correction and crossovers are added under
# `filters:` and `pipeline:`; FIR coefficients live in
# ~/.config/camilladsp/coeffs.
devices:
  samplerate: 48000
  # CamillaDSP derives the ALSA ring from this: the buffer is the next power of
  # two at or above 3x chunksize, and the period is buffer/8. One graph quantum
  # (256, cf. files/media/pipewire/pipewire.conf.d/clock-rate.conf) is the only
  # value that reads cleanly: the ALSA `pipewire` plugin hands out reads of the
  # quantum, not of the requested chunksize, so 512 (a 2048-frame ring, 42.7 ms,
  # underruns down from ~3 to ~1 per 3 minutes of MPD playback) logged "Capture
  # read 256 frames instead of the requested 512" ~34 times a second and filled
  # the journal. A bigger ring needs the graph quantum raised with it, and the
  # RME runs 256-frame periods.
  chunksize: 256
  capture:
    type: Alsa
    channels: 2
    device: "pipewire"
  playback:
    type: Alsa
    channels: 2
    device: "pipewire"
