[package]
name = "pleamar-theme"
version = "0.1.0"
edition = "2021"
description = "pleamar theme pipeline: wallpaper colours and theme files to ~/.config/pleamar/theme.plm"
license = "MIT"

[lib]
name = "pleamar_theme"
path = "src/lib.rs"

[[bin]]
name = "pleamar-theme"
path = "src/main.rs"

[[bin]]
name = "pleamar-themes"
path = "src/bin/pleamar-themes.rs"

# No Rust dependencies on purpose: the only outside tools are the ones the
# shell pipeline already required — ImageMagick for the 48x48 sample and jq
# for --from-json. The awk sampler itself is ported into this crate.

# Standalone: its own workspace root, so this Cargo.lock is the one the nix
# build uses (`src = lib.cleanSource ./.` copies just this directory).
[workspace]
