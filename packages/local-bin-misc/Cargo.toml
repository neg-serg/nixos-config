[package]
name = "local-bin-misc"
version = "0.1.0"
edition = "2021"
description = "Rust ports of the last shell helpers in packages/local-bin/bin (pb, any, v, sclang-pwj, renoise-pwj)"
license = "MIT"

[dependencies]
local-bin-core = { path = "../local-bin-core" }

# One multicall binary: the commands are selected by argv[0] (see src/main.rs).
[[bin]]
name = "local-bin-misc"
path = "src/main.rs"

[workspace]

# The doc comments are the shell originals' snippets, not Rust examples, so the
# lib target has nothing to run as a doctest.
[lib]
doctest = false
