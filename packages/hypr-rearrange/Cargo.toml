[package]
name = "hypr-rearrange"
version = "0.1.0"
edition = "2021"
description = "Move Hyprland windows to the workspaces the config routes them to"
license = "MIT"

[[bin]]
name = "hypr-rearrange"
path = "src/main.rs"

[dependencies]

