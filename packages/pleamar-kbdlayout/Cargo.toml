[package]
name = "pleamar-kbdlayout"
version = "0.1.0"
edition = "2021"
description = "pleamar keyboard-layout worker (hyprctl, JSON lines, INTERFACES.md §7)"
license = "MIT"

[[bin]]
name = "pleamar-kbdlayout"
path = "src/main.rs"

[dependencies]
# Parsing the stdin command lines and writing the sample objects. The worker
# replaces the shell's `jq` pipeline, so it is the one runtime dependency.
serde_json = "1"
# SIGTERM/SIGINT cleanup: std carries no POSIX signal API, and the shell
# trapped both to take the event-stream reader down and exit 0.
signal-hook = "0.3"

# Standalone: its own workspace root, so this Cargo.lock is the one the nix
# build uses (`src = ./.` copies just this directory).
[workspace]
