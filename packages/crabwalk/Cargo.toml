# Standalone on purpose: Nix builds this directory only (buildRustPackage
# copies ./.), so a parent workspace would break the lockfile resolution there.
[workspace]

[package]
name = "crabwalk"
version = "0.1.0"
edition = "2021"
description = "A tiny pixel-perfect platformer painted on the waterfall wallpaper"
authors = ["neg-serg"]

[dependencies]
sdl2 = "0.37"
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
