[package]
name = "local-bin-zsh-extra"
version = "0.1.0"
edition = "2021"
description = "Rust ports of the remaining zsh helpers in packages/local-bin/bin (gh-issues-export, mpd_del_album, sx, sys-relief, vol, win-vm)"
license = "MIT"

# One multicall binary: the commands are selected by argv[0] (see src/main.rs).
[[bin]]
name = "local-bin-zsh-extra"
path = "src/main.rs"

[dependencies]
local-bin-core = { path = "../local-bin-core" }
# gh-issues-export parses the paginated `gh api` stream and renders the YAML
# frontmatter that used to be shaped by jq; serde_json is the only dependency.
serde_json = "1"

[workspace]

# The doc comments are the shell originals' snippets, not Rust examples, so the
# lib target has nothing to run as a doctest.
[lib]
doctest = false
