[package]
name = "mpd-voice"
version = "0.1.0"
edition = "2021"
description = "Voice control for MPD (Rust port)"
license = "MIT"

[[bin]]
name = "mpd-voice"
path = "src/main.rs"

[dependencies]

# Standalone: the crate is its own workspace root, so the Cargo.lock next to
# this manifest is the one the nix build uses (`src = ./.` copies just this
# directory). Otherwise the parent packages/Cargo.toml would pull it in.
[workspace]
