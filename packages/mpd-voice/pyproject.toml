[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mpd-voice"
version = "0.1.0"
description = "Voice control for MPD with local speech recognition"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mpd-voice = "mpd_voice.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["mpd_voice"]
