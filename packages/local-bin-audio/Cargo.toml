[package]
name = "local-bin-audio"
version = "0.1.0"
edition = "2021"
# The command sources live in src/bin/ but are modules now, not binaries.
autobins = false
description = "Rust ports of the audio helpers from packages/local-bin/bin"
license = "MIT"

# One multicall binary: the commands are selected by argv[0] (see src/main.rs).
[[bin]]
name = "local-bin-audio"
path = "src/main.rs"

[workspace]

# The doc comments are the shell originals' snippets, not Rust examples, so the
# lib target has nothing to run as a doctest.
[lib]
doctest = false

[dependencies]
local-bin-core = { path = "../local-bin-core" }
