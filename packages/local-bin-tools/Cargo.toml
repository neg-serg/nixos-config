[package]
name = "local-bin-tools"
version = "0.1.0"
edition = "2021"
description = "Small $PATH helpers that used to be Python scripts in packages/local-bin"
license = "MIT"

# One multicall binary: the commands are selected by argv[0] (see src/main.rs).
[[bin]]
name = "local-bin-tools"
path = "src/main.rs"

[dependencies]
local-bin-core = { path = "../local-bin-core" }
serde_json = "1"
sha1 = "0.10"

[workspace]

# The doc comments are the shell originals' snippets, not Rust examples, so the
# lib target has nothing to run as a doctest.
[lib]
doctest = false
