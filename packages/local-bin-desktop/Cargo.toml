[package]
name = "local-bin-desktop"
version = "0.1.0"
edition = "2021"
# The command sources live in src/bin/ but are modules now, not binaries.
autobins = false
description = "Rust ports of the desktop/media helpers from packages/local-bin/bin"
license = "MIT"

# One multicall binary: the commands are selected by argv[0] (see src/main.rs).
[[bin]]
name = "local-bin-desktop"
path = "src/main.rs"

[dependencies]
local-bin-core = { path = "../local-bin-core" }
# Delivering SIGINT to wf-recorder and probing its liveness (screenrec) needs a
# safe signal API; std can only SIGKILL a Child it still owns.
nix = { version = "0.30", default-features = false, features = [
  "signal",
  "process",
] }

[workspace]

# The doc comments are the shell originals' snippets, not Rust examples, so the
# lib target has nothing to run as a doctest.
[lib]
doctest = false
