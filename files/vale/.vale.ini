# Vale prose linter config — global, used by nvim-lint for markdown.
#
# The Google style is vendored under files/vale/styles/Google (upstream
# vale-cli/Google v0.7.2). Home-manager links StylesPath into the store, so the
# copy is read-only at runtime and `vale sync` cannot update it: bump the files
# by hand and keep the version tag above in sync.
StylesPath = /home/neg/.local/share/vale/styles
MinAlertLevel = suggestion
Vocab = Base

[*.md]
BasedOnStyles = Vale, Google

# Vale.Spelling is a real spellchecker; Google.Spelling only rewrites British
# spellings to American ones. The project vocabulary lives in
# files/vale/styles/config/vocabularies/Base/accept.txt.
Vale.Spelling = error
Vale.Repetition = error
# Vale.Terms would read accept.txt as the only accepted casing for every entry,
# which turns ordinary mixed-case identifiers into hundreds of false positives.
Vale.Terms = NO

# Google marks several style preferences as `error` — 'e.g.' must become 'for
# example', a comma must sit inside the quotes — which would make the lint gate
# fail on prose that is merely not Googlish. `error` stays reserved for spelling,
# repetition and objectively malformed text (dates, spacing, slang), so those
# rules keep their upstream level and these become warnings.
Google.Latin = warning
Google.Quotes = warning
Google.Units = warning
Google.Exclamation = warning
Google.LyHyphens = warning
Google.Ordinal = warning
Google.OptionalPlurals = warning

# Google's developer-docs house style, which contradicts this repo's own
# conventions: spaced em dashes (the AGENTS.md reply format), parentheticals in
# lists, semicolons, contractions, passive voice, Title Case headings and
# technical acronyms. These nine rules are ~95% of the raw alert volume.
Google.EmDash = NO
Google.Semicolons = NO
Google.Parens = NO
Google.Contractions = NO
Google.Passive = NO
Google.Acronyms = NO
Google.Headings = NO
Google.WordList = NO
Google.WordListCase = NO
