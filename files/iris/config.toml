# iris — compatibility config for odin's shell stack.
#
# What is rebinding and why:
# - select = "tab" — Tab inserts the top suggestion (commands, file paths).
#   NOTE: iris consumes Tab even with the menu hidden, so native zsh
#   completion on Tab is shadowed while iris runs; file paths are covered by
#   iris's own file suggestions. Menu selection also works via Up/Down + Enter.
# - toggle-mode = "ctrl+r" — iris history mode (zhist hook disabled).
# - navigate-closed = "shell" — Up/Down with the menu closed go to zsh, so
#   up-line-or-beginning-search / down-line-or-beginning-search keep working.

[core]
version = 1
shell = "zsh"
navigate-closed = "shell"

[keybindings]
toggle-mode = "ctrl+r"
toggle-menu = "shift+tab"
select = "tab"
navigate-up = "up"
navigate-down = "down"
navigate-right = "right"

# NixOS owns updates — never self-update (the store binary is read-only anyway).
[updater]
check-on-startup = false
auto-update = 0
