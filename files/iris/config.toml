# iris — compatibility config for trantor's shell stack.
#
# What is rebinding and why:
# - select = "ctrl+e" + [trantor] patch: accepts the pending iris suggestion
#   (Ctrl+E). With no suggestion pending it falls through to zsh, so Ctrl+E
#   stays end-of-line. Tab is fully zsh's: fzf-on-tab completion + ~/m/new
#   fuzzy expansion.
# - mode = "spec" — suggest from command specs + filegen + AI only; shell
#   history junk (dsh persistent-bash entries) never becomes a ghost.
# - toggle-mode = "" — Ctrl+R belongs to the shell: hishtory owns the history
#   picker (07-hishtory.zsh) and fzf has its own binding, so iris's spec/history
#   toggle is off instead of fighting them. To try it: toggle-mode = "ctrl+r".
# - navigate-up/down = "ctrl+p"/"ctrl+n" — emacs-style; with the menu closed
#   they are forwarded to zsh, so the existing ^P/^N history-search bindings
#   keep working (menu open -> cycle iris ghost suggestion).
# - navigate-right = "right" — inert while ghost-text = 0 (there is nothing to
#   accept): the right arrow is forwarded to zsh and just moves the cursor.
#   If ghost text is ever turned on, set this to "" so the arrow keeps moving
#   the cursor and suggestions are accepted with Ctrl+E only.
# - navigate-closed = "shell" — nav keys with the menu closed go to zsh, so
#   up-line-or-beginning-search / down-line-or-beginning-search keep working.

[core]
version = 1
shell = "zsh"
# kitty starts the shell as a login shell (kitty.conf: `shell .`); the child
# shell iris spawns keeps that, so /etc/zprofile and ~/.zprofile still run.
shell-login = true
mode = "spec"
navigate-closed = "shell"

# Menu only, no ghost text (mode 0): iris draws its menu below the line and
# nothing after the cursor, so zsh-native-syntax keeps the line to itself and
# there is no ghost for the right arrow to accept. Selection: Ctrl+P/N + Enter,
# accept with Ctrl+E; Tab stays with fzf-on-tab (completion + ~/m/new).
[ui]
ghost-text = 0

[keybindings]
toggle-mode = ""         # ^R is hishtory's (see the header)
toggle-menu = "shift+tab"
select = "ctrl+e"
navigate-up = "ctrl+p"
navigate-down = "ctrl+n"
navigate-right = "right"

# NixOS owns updates — never self-update (the store binary is read-only anyway).
[updater]
check-on-startup = false
auto-update = 0

# zoxide is installed and wired (Ctrl+Y); let iris also rank cd suggestions
# by its frecency database, not just the current directory's children.
[zoxide]
extend-cd = true

# AI suggestions from the local ollama (127.0.0.1:11434, OpenAI-compatible).
# qwen2.5-coder:7b-instruct-q6_K: warm latency 130-190 ms on the 9070 XT and
# correct completions (benchmarked; llama3.2:1b is faster to load but answers
# wrong). keep_alive keeps the model resident in VRAM between keystrokes —
# without it ollama evicts the model and every request pays a ~1.5-2 s cold start.
# debounce_ms = pause after typing stops before the AI ghost appears.
[ai]
enabled = true
provider = "ollama"
debounce_ms = 400
min_interval_ms = 600

[ai.providers.ollama]
inherited_from = "openai"
endpoint = "http://127.0.0.1:11434/v1"
model = "qwen2.5-coder:7b-instruct-q6_K"
timeout_ms = 5000
extra_request_body = { keep_alive = "30m" }
