# iris — compatibility config for trantor's shell stack.
#
# What is rebinding and why:
# - select = "tab" + [trantor] patch: Tab accepts the menu's current suggestion
#   while the menu is visible; with no menu it falls through to zsh, so Tab
#   keeps fzf-on-tab completion + ~/m/new fuzzy expansion. Ctrl+E is not bound
#   by iris at all and stays end-of-line.
# - mode = "spec" — suggest from command specs + filegen + AI only; shell
#   history junk (dsh persistent-bash entries) never becomes a ghost. The
#   [trantor] spec-relevance patch keeps top-level specs to commands that are
#   actually runnable here: binaries on PATH plus shell builtins, no macOS-only
#   tools (dscacheutil, dscl, launchctl, ...) and no uninstalled CLIs.
# - toggle-mode = "" — really disabled: the [trantor] empty-keybindings patch
#   stops Load() from re-filling it with the ctrl+r default. Ctrl+R stays with
#   hishtory (07-hishtory.zsh) and fzf. To try the toggle: "ctrl+r".
# - navigate-up/down = "ctrl+p"/"ctrl+n" — home-row keys, no arrows in the
#   menu: while the menu is open they move the selection, and at the list edge
#   (nothing further up/down) the [trantor] nav-fallthrough patch hands the key
#   back to zsh instead of swallowing it — `ds` + ^P still recalls the last
#   `dsh …` command from history. With the menu closed navigate-closed =
#   "shell" forwards them to zsh, so the old ^P/^N history search keeps
#   working. Arrows are never bound by iris — they stay pure zsh (cursor
#   motion, up/down-line-or-beginning-search).
# - navigate-right = "right" — inert while ghost-text = 0 (there is nothing to
#   accept): the right arrow is forwarded to zsh and just moves the cursor.
#   If ghost text is ever turned on, set this to "" so the arrow keeps moving
#   the cursor and suggestions are accepted with Tab only.
# - navigate-closed = "shell" — nav keys with the menu closed go to zsh, so
#   up-line-or-beginning-search / down-line-or-beginning-search keep working.
# - Enter runs the highlighted suggestion once the menu was navigated, Esc
#   hides the menu (both built in).

[core]
version = 1
shell = "zsh"
# kitty starts the shell as a login shell (kitty.conf: `shell .`); the child
# shell iris spawns keeps that, so /etc/zprofile and ~/.zprofile still run.
shell-login = true
mode = "spec"
navigate-closed = "shell"

# Menu only, no ghost text (mode 0): iris draws its menu below the line and
# nothing after the cursor, so zsh-native-syntax keeps the line to itself and
# there is no ghost for the right arrow to accept. Selection: Ctrl+P/N + Enter,
# accept with Tab; with the menu hidden Tab falls through to fzf-on-tab
# (completion + ~/m/new).
[ui]
ghost-text = 0

[keybindings]
toggle-mode = ""          # disabled — ^R stays hishtory's (see the header)
toggle-menu = "shift+tab"
select = "tab"            # accept; falls through to fzf-on-tab without a menu
navigate-up = "ctrl+p"
navigate-down = "ctrl+n"
navigate-right = "right"

# NixOS owns updates — never self-update (the store binary is read-only anyway).
[updater]
check-on-startup = false
auto-update = 0

# zoxide is installed and wired (Ctrl+Y); let iris also rank cd suggestions
# by its frecency database, not just the current directory's children.
[zoxide]
extend-cd = true

# AI suggestions from the local ollama (127.0.0.1:11434, OpenAI-compatible).
# qwen2.5-coder:7b-instruct-q6_K: warm latency 130-190 ms on the 9070 XT and
# correct completions (benchmarked; llama3.2:1b is faster to load but answers
# wrong). keep_alive keeps the model resident in VRAM between keystrokes —
# without it ollama evicts the model and every request pays a ~1.5-2 s cold start.
# debounce_ms = pause after typing stops before the AI ghost appears.
[ai]
enabled = true
provider = "ollama"
debounce_ms = 400
min_interval_ms = 600

[ai.providers.ollama]
inherited_from = "openai"
endpoint = "http://127.0.0.1:11434/v1"
model = "qwen2.5-coder:7b-instruct-q6_K"
timeout_ms = 5000
extra_request_body = { keep_alive = "30m" }
