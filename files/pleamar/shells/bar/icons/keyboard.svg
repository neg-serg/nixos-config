<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor">
  <!-- split keyboard, left half -->
  <rect x="1" y="5" width="6" height="1"/>
  <rect x="1" y="7" width="6" height="1"/>
  <rect x="1" y="9" width="6" height="1"/>
  <rect x="1" y="11" width="3" height="1"/>
  <rect x="5" y="11" width="2" height="1"/>
  <!-- right half -->
  <rect x="9" y="5" width="6" height="1"/>
  <rect x="9" y="7" width="6" height="1"/>
  <rect x="9" y="9" width="6" height="1"/>
  <rect x="11" y="11" width="4" height="1"/>
  <!-- thumb clusters: the halves angle inwards -->
  <rect x="5" y="13" width="2" height="1"/>
  <rect x="9" y="13" width="2" height="1"/>
</svg>
