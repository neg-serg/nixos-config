# rtpmidid config — RTP-MIDI (AppleMIDI) listener for the dockur Windows VM.
# The VM's rtpMIDI connects OUT to 192.168.0.11:5010 (host alias — the host's
# main address 192.168.0.10 is the VM's own IP, unreachable from the VM).
[general]
alsa_name=GLM
control=/tmp/rtpmidid-control.sock
log_level=info

[rtpmidi_announce]
name=GLM
port=5010
