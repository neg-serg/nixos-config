# Neru — desktop keyboard navigation: hints, grids, bisect and vim-style modes.
#
# Linux ships no global hotkeys by default (so none collide with terminal
# shortcuts), so the modes are bound here. Ctrl+Alt+… stays clear of this
# machine's Super(Alt)-based Hyprland binds and the Ctrl+Shift terminal ones.
# Scroll sits on Ctrl+Alt+W on purpose: Ctrl+Alt+S is kitty's
# scrollback_nvim (files/kitty/key.conf).
# Apply edits with `neru config reload` (the daemon does not watch the file).

# Latin hint letters must be typeable while the focused window is on the ru
# layout, so neru reads keys as if the keyboard were us.
[general]
kb_layout_to_use = "us"

[hints]
# Linux defaults to `contour`, which in text-heavy windows labels every blob it
# finds (measured ~600 labels in a terminal) and covers the screen. `segment`
# with `controls` is instant, needs no OCR, and labels buttons, fields, icons
# and pictures only -> far fewer boxes. Text targets stay on Ctrl+Alt+F
# (vision + search), which overrides the strategy per activation.
strategy = "segment"

[hints.segment]
targets = "controls"

# Stock labels are 95%-opaque boxes with an accent border, which hides what is
# under them. Smaller, borderless and 60% opaque keeps the window readable.
[hints.ui]
font_size = 9
padding_x = 3
padding_y = 1
border_width = 0
background_color = { light = "#99EEF2FF", dark = "#990A1338" }

[hotkeys]
# Hints click as soon as a label is typed and reopen for the next target
# (--repeat): chained clicking, Esc exits. Right/middle click stay on
# Shift+R / Shift+M inside the mode.
"Ctrl+Alt+Space" = "hints --action left_click --repeat"
# Text search among hints: typing filters by element text, Return clicks the
# top match (Tab cycles matches). Search needs element text, so it runs on
# vision/OCR — contour hints carry none, and axtree finds nothing on this
# machine yet. OCR reads Latin text best and takes ~1.5 s per activation.
"Ctrl+Alt+F" = "hints --strategy vision --search --action left_click --repeat"
"Ctrl+Alt+C" = "recursive_grid"
"Ctrl+Alt+W" = "scroll"
"Ctrl+Alt+B" = "bisect"
"Ctrl+Alt+G" = "grid"
