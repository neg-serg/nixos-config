# neg palette, variant 1 — the terminal table this shell used before the
# variants existed (the "dank" base16 that files/kitty/theme.conf grew from).
# It is the default until `shell-theme use v2`; see theme.conf for the switch.
# The 256-colour table and the marks are shared by both variants and live in
# files/kitty/theme.conf, so only the sixteen ANSI slots belong here.

foreground #6C7E96
background #000000
selection_foreground #367bbf
selection_background #0d1824

color0    #020202
color1    #8A2F58
color2    #287373
color3    #914E89
color4    #395573
color5    #5E468C
color6    #31658C
color7    #899CA1
color8    #3D3D3D
color9    #CF4F88
color10   #53A6A6
color11   #BF85CC
color12   #477AB3
color13   #7E62B3
color14   #6096BF
color15   #617287
