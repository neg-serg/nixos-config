# neg palette, variant 2 — the sixteen ANSI slots taken from the neg.nvim
# roles (files/shell/zsh-native-syntax/neg.ini documents the same table), so
# TUI apps that still paint through the terminal's own table match the shell's
# truecolor theme instead of a second, unrelated palette.
#
# Slots 0-8 are palette stops. The palette is deliberately narrow, so slots
# 9-14 are derived in CIELAB as the bright member of the same hue: L* + 12 and
# C* x 0.85 of the slot below (clipped at L* 84 / the sRGB gamut). Slot 15 is
# neg's `whit`; `err` #CF4F88 is kitty color9, the one readable red the stack
# has (neg's own reds are background tints).
#
#  0 #15181F dnorm     4 #367CB0 ops1      8  #506A7D dbng
#  1 #CF4F88 err       5 #A47EAD lilac     9  #E779A6 err        (L*65)
#  2 #127A57 lit3      6 #148787 lit2      10 #4C9878 lit3       (L*57)
#  3 #C8A8EF dwarn     7 #6C7E96 norm      11 #E2C6FF dwarn      (L*84)
#                                          12 #689AC8 ops1       (L*62)
#                                          13 #C1A0C9 lilac      (L*70)
#                                          14 #55A5A4 lit2       (L*63)
#                                          15 #D1E5FF whit
#
# `shell-theme use v2` selects this file; v1 is the previous table.

foreground #6C7E96
background #000000
selection_foreground #367bbf
selection_background #0d1824

color0    #15181F
color1    #CF4F88
color2    #127A57
color3    #C8A8EF
color4    #367CB0
color5    #A47EAD
color6    #148787
color7    #6C7E96
color8    #506A7D
color9    #E779A6
color10   #4C9878
color11   #E2C6FF
color12   #689AC8
color13   #C1A0C9
color14   #55A5A4
color15   #D1E5FF
