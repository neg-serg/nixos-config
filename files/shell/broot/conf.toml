# broot configuration — neg.nvim-themed, full file-manager setup.
# default_flags: s = sizes, d = dates, p = permissions.

default_flags = "sdp"
true_colors = true
icon_theme = "vscode"
show_selection_mark = true

# date_time_format = "%Y/%m/%d %R"

[[verbs]]
invocation = "edit"
key = "ctrl-t"
shortcut = "e"
execution = "$EDITOR {file}"
leave_broot = false
apply_to = "file"

[[verbs]]
invocation = "create {subpath}"
execution = "$EDITOR {directory}/{subpath}"
leave_broot = false

[[verbs]]
invocation = "mkdir {subpath}"
execution = "mkdir -p {directory}/{subpath}"
leave_broot = false

[[verbs]]
invocation = "touch {new_file}"
execution = "touch {directory}/{new_file}"
leave_broot = false

[[verbs]]
invocation = "rm"
internal = "trash"
leave_broot = false

[[verbs]]
invocation = "git_diff"
shortcut = "gd"
leave_broot = false
execution = "git difftool -y {file}"

[[verbs]]
name = "view"
invocation = "view"
execution = "$PAGER {file}"
leave_broot = false

[[verbs]]
invocation = "home"
shortcut = "gg"
execution = ":focus ~"

# File-manager navigation: parent / open (mirrors up/down muscle memory).
[[verbs]]
key = "alt-up"
internal = "up_tree"

[[verbs]]
key = "alt-down"
internal = "open_stay"

[[verbs]]
key = "ctrl-j"
execution = ":line_down"

[[verbs]]
key = "ctrl-k"
execution = ":line_up"

[[verbs]]
key = "ctrl-d"
execution = ":page_down"

[[verbs]]
key = "ctrl-u"
execution = ":page_up"

[[verbs]]
key = "ctrl-g"
execution = ":toggle_git_status"

[ext-colors]
png = "rgb(0, 160, 130)"
jpg = "rgb(0, 160, 130)"
jpeg = "rgb(0, 160, 130)"
gif = "rgb(0, 160, 130)"
webp = "rgb(0, 160, 130)"
svg = "rgb(200, 168, 239)"
rs = "rgb(200, 168, 239)"
nix = "rgb(0, 160, 130)"
lua = "rgb(54, 124, 176)"
toml = "rgb(54, 124, 176)"
yaml = "rgb(54, 124, 176)"
yml = "rgb(54, 124, 176)"
json = "rgb(54, 124, 176)"
md = "rgb(0, 95, 175)"

