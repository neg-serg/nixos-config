# broot configuration — neg.nvim-themed, full file-manager setup.
#
# Keep only permissions (p) as a default column. Sizes (s) and dates (d) are
# computed by walking the whole subtree — dates look for the most recently
# modified file, even deep — so on a multi-terabyte $HOME the tree freezes on
# "computing" before it becomes usable. Toggle them per view with
# :toggle_sizes / :toggle_dates; small trees (e.g. this repo) stay instant.

default_flags = "p"
true_colors = true
icon_theme = "vscode"
show_selection_mark = true
quit_on_last_cancel = true

# date_time_format = "%Y/%m/%d %R"

[[verbs]]
invocation = "edit"
key = "ctrl-t"
shortcut = "e"
execution = "$EDITOR {file}"
leave_broot = false
apply_to = "file"

# New file in one keystroke: ctrl-n pre-fills `:create `, type the name, enter.
# With auto_exec disabled the key only opens the prompt, so the name is typed
# on the same input line instead of going through the `:` command search.
[[verbs]]
invocation = "create {subpath}"
key = "ctrl-n"
auto_exec = false
execution = "$EDITOR {directory}/{subpath}"
leave_broot = false

[[verbs]]
invocation = "mkdir {subpath}"
execution = "mkdir -p {directory}/{subpath}"
leave_broot = false

# Empty file without the editor: alt-n pre-fills `:touch `, type the name,
# enter. `touch` stays available as a command for the same action.
[[verbs]]
invocation = "touch {new_file}"
key = "alt-n"
auto_exec = false
execution = "touch {directory}/{new_file}"
leave_broot = false

[[verbs]]
invocation = "rm"
internal = "trash"
leave_broot = false

[[verbs]]
invocation = "git_diff"
shortcut = "gd"
leave_broot = false
execution = "git difftool -y {file}"

[[verbs]]
name = "view"
invocation = "view"
execution = "$PAGER {file}"
leave_broot = false

[[verbs]]
invocation = "home"
shortcut = "gg"
execution = ":focus ~"

# File-manager navigation: parent / open (mirrors up/down muscle memory).
[[verbs]]
key = "alt-up"
internal = "up_tree"

[[verbs]]
key = "alt-down"
internal = "open_stay"

[[verbs]]
key = "ctrl-j"
execution = ":line_down"

[[verbs]]
key = "ctrl-k"
execution = ":line_up"

[[verbs]]
key = "ctrl-d"
execution = ":page_down"

[[verbs]]
key = "ctrl-u"
execution = ":page_up"

[[verbs]]
key = "ctrl-g"
execution = ":toggle_git_status"

# Jump to a path: alt-p, paste packages/telegram-notify/assets/avatar.svg, enter.
# The filter input parses "/" as a search-mode separator, so a pasted path is
# rejected as an unknown mode; :show takes the argument as a path instead, adds
# the missing tree lines and selects the file. The path must be under the
# current root. :select_first runs first because :show resolves a relative
# argument from the selected directory, and the point of the key is a
# root-relative path (an absolute path ignores the selection anyway).
[[verbs]]
invocation = "goto {path}"
key = "alt-p"
cmd = ":select_first;:show {path}"
auto_exec = false

# The clipboard: ctrl-v (the built-in :input_paste) also reads what a file
# manager copies — text/uri-list, and GNOME's x-special/gnome-copied-files
# list — and acts on the files rather than on their raw URIs: a copied
# directory is entered, a copied file is revealed, several files open the
# directory that holds them. With something already typed in the input,
# ctrl-v inserts the decoded paths instead, so `:show ` + ctrl-v is the same
# jump as alt-p without typing the path.

[ext-colors]
png = "rgb(0, 160, 130)"
jpg = "rgb(0, 160, 130)"
jpeg = "rgb(0, 160, 130)"
gif = "rgb(0, 160, 130)"
webp = "rgb(0, 160, 130)"
svg = "rgb(200, 168, 239)"
rs = "rgb(200, 168, 239)"
nix = "rgb(0, 160, 130)"
lua = "rgb(54, 124, 176)"
toml = "rgb(54, 124, 176)"
yaml = "rgb(54, 124, 176)"
yml = "rgb(54, 124, 176)"
json = "rgb(54, 124, 176)"
md = "rgb(0, 95, 175)"

