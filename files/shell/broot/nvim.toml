# Verb overrides for broot sessions launched from inside Neovim
# (9999years/broot.nvim). Loaded via --conf BEFORE conf.toml so these
# bindings win: broot resolves duplicate keys by first match. Every
# command runs in the SAME Neovim instance (outcmd -> ex-command).
#
# Keys mirror yazi.nvim muscle memory:
#   enter       open file in the current window
#   ctrl-v      open in vertical split
#   ctrl-x      open in horizontal split
#   ctrl-t      open in a new tab
#   alt-enter   cd into the selected directory (broot built-in)

[[verbs]]
key = "enter"
invocation = "edit"
shortcut = "e"
apply_to = "file"
external = "broot.nvim edit +{line} {file}"
from_shell = true

[[verbs]]
key = "ctrl-v"
invocation = "edit_vsplit"
apply_to = "file"
external = "broot.nvim vsplit +{line} {file}"
from_shell = true

[[verbs]]
key = "ctrl-x"
invocation = "edit_hsplit"
apply_to = "file"
external = "broot.nvim split +{line} {file}"
from_shell = true

[[verbs]]
key = "ctrl-t"
invocation = "edit_tab"
apply_to = "file"
external = "broot.nvim tabnew +{line} {file}"
from_shell = true
