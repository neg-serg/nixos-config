; neg — zsh-native-syntax theme in the neg.nvim palette.
;
; Palette source: https://github.com/neg-serg/neg.nvim (lua/neg/palette.lua),
; the same roles the other themed surfaces of this repo use (files/gui/
; neg-gtk*.css, files/lazytail/themes/neg.yaml). Colours are 24-bit hex, so
; this file no longer depends on the terminal's 256-colour table: index 61
; meant whatever the emulator said it meant, and the shell drifted away from
; `ls` as soon as that table changed.
;
; Roles, in the order neg.nvim uses them:
;   norm      #6c7e96  default text, plain files
;   comm      #363f4b  comments, logs (neg derives it from norm)
;   dbng      #506a7d  dim surfaces, config files
;   lstr      #6e879f  strings, options
;   darkhigh  #7387a1  variables, secondary text
;   high      #a5c1e6  light end of the ladder, brackets
;   whit      #d1e5ff  brightest text
;   iden      #6289b3  identifiers, source code
;   func      #7095b0  functions, data store
;   ops1      #367cb0  numbers, commands
;   ops2      #2b7694  operators, keywords, reserved words
;   ops3      #005faf  builtins, directories, path separators
;   ops4      #395573  muted accents (block devices)
;   dlim      #4779b3  delimiters, documents
;   incl      #005f87  web files, includes
;   otag      #357b63  packages, tags
;   lit1      #127978  dim literals, subtitles
;   lit2      #148787  globbing, aliases, case patterns
;   lit3      #127a57  shell and web source, libraries
;   dadd      #007a66  lossless audio, globbing
;   dchg      #1d4aaf  changed lines, vim configs
;   dwarn     #c8a8ef  attention, emulator roms
;   err       #cf4f88  errors, matherr (kitty color9)
;   violet    #746b9e  derived stop, see below
;   lilac     #a47ead  derived stop, see below
;
; Two stops are derived in CIELAB because their family had no readable member
; on #000000: violet #746b9e (L* 48, C* 30, h 300 — archives, themes) and lilac
; #a47ead (L* 58, C* 30, h 320 — disk images, brackets). `err` is kitty color9:
; neg's own reds (#6b0f2a, #5f0000) are background tints and vanish as text.
; correct-subtle/incorrect-subtle are 25% tints of dadd/dred — the palette has
; no stop that dark, and a full-strength bar is too loud under the cursor.
;
; [file-extensions] mirrors files/shell/dircolors/dircolors: the engine also
; reads LS_COLORS, so an extension has to resolve to the same hex in both
; files. scripts/dev/check-shell-palette.sh keeps the two tables in step.
[base]
default          = none
unknown-token    = none
commandseparator = #363f4b
redirection      = #2b7694
here-string-tri  = #148787
here-string-text = bg:#1c334e
here-string-var  = #6e879f,bg:#1c334e
exec-descriptor  = #127a57,bold
comment          = #363f4b,italic
correct-subtle   = bg:#001f1a
incorrect-subtle = bg:#1b040b
subtle-bg        = bg:#15181f
recursive-base   = #a5c1e6
secondary        = none

[command-point]
reserved-word  = #2b7694
alias          = #148787
suffix-alias   = #148787
global-alias   = #148787,bg:#15181f
builtin        = #005faf
function       = #7095b0
command        = #367cb0
precommand     = #005faf
hashed-command = #7095b0
single-sq-bracket = #4779b3
double-sq-bracket = #4779b3
double-paren   = #4779b3

[paths]
path          = none
pathseparator = #005faf
path-to-dir   = #6c7e96,underline
globbing      = #148787
globbing-ext  = #506a7d

[brackets]
paired-bracket = #d1e5ff,bg:#223f73
bracket-level-1 = #a5c1e6
bracket-level-2 = #4779b3
bracket-level-3 = #7387a1

[arguments]
single-hyphen-option   = #6e879f
double-hyphen-option   = #6e879f
back-quoted-argument   = none
single-quoted-argument = #6e879f
double-quoted-argument = #6e879f
dollar-quoted-argument = #6e879f

[in-string]
; backslash in $'...'
back-dollar-quoted-argument           = #148787
; backslash or $... in "..."
back-or-dollar-double-quoted-argument = #148787

[other]
variable             = #7387a1
assign               = #6289b3
assign-array-bracket = #4779b3
history-expansion    = #127978,bold

[math]
mathvar = #2b7694,bold
mathnum = #367cb0
matherr = #cf4f88

[for-loop]
forvar = #7387a1
fornum = #367cb0
; operator
foroper = #2b7694
; separator
forsep = #4779b3

[case]
case-input       = #148787
case-parentheses = #4779b3
case-condition   = bg:#0c1c30

