# qmllint settings for the quickshell config.
#
# `qmllint` is only useful when its import paths are configured — see
# scripts/dev/check-qml-lint.sh, which passes them (`-E -I .` plus one `-i` per
# qmldir). Without that it reported ~9.7k warnings for this tree, ~90% of them
# "module not found" noise, and the four real defects below were invisible in it:
#   * Theme.uiRadiusSmall / Theme.fontSizeMedium — properties that never existed,
#     read as undefined and absorbed by the expressions around them;
#   * screen.virtualGeometry — same, in ScreenUtil and StyledTooltip;
#   * Repeater.spacing, parent.spacing in a delegate — also never exists;
#   * three types declared `pragma Singleton` but registered as plain types.
#
# Levels: disable = silent, info = reported but never fails, warning = fails the
# gate, error = always fails. The gate keeps `unqualified` off (717 of them: the
# singletons here are used qualified on purpose, and delegates legitimately reach
# for their enclosing scope), and keeps the categories that cannot see through
# Quickshell's plugin types or the Qt framework's own members at `info` — they
# are listed in the script as KNOWN-INHERENT, with the count they currently
# produce, so a new one of those kinds still shows up as a change in the count.

[Warnings]
# Delegates and inline components legitimately reach for their enclosing scope
# (`modelData`, an id defined further up); 717 of these, no defect behind any of
# them. Everything else keeps its default level.
unqualified=disable

# "No type found for property X" fires for every property of our own components
# whose qmltypes the analyzer cannot see (custom QML types); the same false
# positive as `import`, not a signal.
missing-type=info
