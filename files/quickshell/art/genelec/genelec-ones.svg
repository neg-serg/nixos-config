<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- Genelec 8341A "The Ones" coaxial monitor, symmetric front silhouette.
       Outer cabinet is a rounded barrel: narrow rounded top, sides bulge to
       max width at mid-height, curve back to a rounded chin, then a small foot
       below. Inside there is a recessed rounded-rectangle faceplate holding the
       driver, and two small rectangular pads at its top corners. One large
       woofer ring with a coaxial mid/tweeter unit (mid ring, dome ring, hollow
       dome) at the centre; small power LED to the left; thin GENELEC wordmark
       band near the bottom. Bass reflex port is on the REAR (not drawn).
       Monochrome white so MultiEffect.colorization can tint it to the level. -->
