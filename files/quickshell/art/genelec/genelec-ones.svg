    <path stroke-width="0.7" d="M9.3 2.7 C10.9 2.0 13.1 2.0 14.7 2.7 C17.7 3.1 19.4 5.0 19.5 8.0 C19.6 11.0 19.6 13.0 19.3 15.6 C18.9 18.6 17.4 20.0 14.9 20.3 C13.9 20.5 10.1 20.5 9.1 20.3 C6.6 20.0 5.1 18.6 4.7 15.6 C4.4 13.0 4.4 11.0 4.5 8.0 C4.6 5.0 6.3 3.1 9.3 2.7 Z"/>
