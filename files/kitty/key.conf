kitty_mod ctrl+shift
clear_all_shortcuts yes
# Every map below carries --allow-fallback=shifted,ascii: custom mappings
# default to the `shifted` fallback only, so without it a bind written in
# Latin stops matching under a non-Latin layout (the ru layout turns the key
# into Cyrillic; with `ascii` allowed kitty falls back to the base-layout key).
# kitty's own default shortcuts use the same pair. Guarded by
# lib/kitty-config-tests.nix.

action_alias neghints kitten hints --alphabet wersdfa --hints-background-color black --hints-foreground-color 25 --hints-text-color 246
map --allow-fallback=shifted,ascii kitty_mod+g         no_op

map --allow-fallback=shifted,ascii insert              paste_from_clipboard
map --allow-fallback=shifted,ascii kitty_mod+v         paste_from_clipboard
# clear_all_shortcuts dropped the stock copy/paste pair; paste is kept above,
# copy is restored here.
map --allow-fallback=shifted,ascii kitty_mod+c         copy_to_clipboard
map --allow-fallback=shifted,ascii kitty_mod+z         scroll_to_prompt -1
map --allow-fallback=shifted,ascii kitty_mod+x         scroll_to_prompt 1

map --allow-fallback=shifted,ascii kitty_mod+alt+t     set_tab_title
map --allow-fallback=shifted,ascii kitty_mod+,         move_tab_backward
map --allow-fallback=shifted,ascii kitty_mod+.         move_tab_forward
map --allow-fallback=shifted,ascii kitty_mod+q         close_tab
map --allow-fallback=shifted,ascii shift+cmd+w         close_os_window

map --allow-fallback=shifted,ascii kitty_mod+l         next_layout
map --allow-fallback=shifted,ascii kitty_mod+escape    kitty_shell window
map --allow-fallback=shifted,ascii kitty_mod+f2        edit_config_file
map --allow-fallback=shifted,ascii kitty_mod+u         kitten unicode_input

map --allow-fallback=shifted,ascii kitty_mod+/         launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

map --allow-fallback=shifted,ascii kitty_mod+a>1       set_background_opacity 1
map --allow-fallback=shifted,ascii kitty_mod+a>d       set_background_opacity default
map --allow-fallback=shifted,ascii kitty_mod+a>l       set_background_opacity -0.1
map --allow-fallback=shifted,ascii kitty_mod+a>m       set_background_opacity +0.1
map --allow-fallback=shifted,ascii kitty_mod+delete    clear_terminal reset active

map --allow-fallback=shifted,ascii kitty_mod+r>r       load_config_file
map --allow-fallback=shifted,ascii kitty_mod+r>e       debug_config

map --allow-fallback=shifted,ascii ctrl+left           previous_tab
map --allow-fallback=shifted,ascii ctrl+right          next_tab
map --allow-fallback=shifted,ascii alt+n               new_tab
map --allow-fallback=shifted,ascii kitty_mod+t        new_tab

map --allow-fallback=shifted,ascii ctrl+equal          change_font_size all +0.5
map --allow-fallback=shifted,ascii ctrl+minus          change_font_size all -0.5
map --allow-fallback=shifted,ascii kitty_mod+backspace change_font_size all 0

# Font size of the CURRENT OS window only (kitty requires the `all`/`current`
# token; `all` also rewrites the default font size for new OS windows).
# The font_zoom.py watcher adopts manual changes as its new baseline, so a zoom
# here survives later window resizes; `0` restores this window's default size.
# Mouse: ctrl+super+wheel in Hyprland (kitty cannot map scroll events) --
# see docs/howto/kitty-font-zoom.md.
map --allow-fallback=shifted,ascii kitty_mod+equal     change_font_size current +0.5
map --allow-fallback=shifted,ascii kitty_mod+minus     change_font_size current -0.5
map --allow-fallback=shifted,ascii kitty_mod+0         change_font_size current 0

map --allow-fallback=shifted,ascii kitty_mod+b         move_window_backward
map --allow-fallback=shifted,ascii kitty_mod+f         move_window_forward
map --allow-fallback=shifted,ascii kitty_mod+`         move_window_to_top
map --allow-fallback=shifted,ascii kitty_mod+]         next_window
map --allow-fallback=shifted,ascii kitty_mod+[         previous_window
map --allow-fallback=shifted,ascii kitty_mod+r>w       start_resizing_window
map --allow-fallback=shifted,ascii kitty_mod+w         close_window

# Hint layer: Ctrl+Alt+S, not Ctrl+S. Herdr's prefix is Ctrl+S
# (files/herdr/config.toml), and kitty consumes a mapped sequence prefix before
# the program sees it: a Ctrl+S>... map would shadow Herdr's prefix+h/l (pane
# focus), prefix+w (workspace picker) and prefix+p (previous tab). Ctrl+Alt
# matches the emacs scroll layer below. `--program -` pastes the picked text
# into the running program; the kitty_mod+s>... twins put it in the clipboard.
map --allow-fallback=shifted,ascii ctrl+alt+s>w        neghints --type word --program -
map --allow-fallback=shifted,ascii ctrl+alt+s>l        neghints --type line --program -
map --allow-fallback=shifted,ascii ctrl+alt+s>p        neghints --type path --program -
map --allow-fallback=shifted,ascii ctrl+alt+s>h        neghints --type hash --program -
map --allow-fallback=shifted,ascii kitty_mod+s>f       neghints --program @
map --allow-fallback=shifted,ascii kitty_mod+s>w       neghints --type word --program @
map --allow-fallback=shifted,ascii kitty_mod+s>l       neghints --type line --program @
map --allow-fallback=shifted,ascii kitty_mod+s>p       neghints --type path --program @
map --allow-fallback=shifted,ascii kitty_mod+s>h       neghints --type hash --program @
map --allow-fallback=shifted,ascii kitty_mod+e         neghints --type=url

# --- Emacs-style scrollback navigation (additive; kitty_mod/vim keys still work) ---
# C-n/C-p: line down/up, C-f/C-b: page down/up, C-home/C-end: top/end of scrollback,
# M-v: page up (C-v stays paste). The ru layout needs no duplicates:
# every map below carries --allow-fallback=shifted,ascii.
# Ctrl+Alt (not Ctrl+Shift) is used so the kitty_mod (Ctrl+Shift) window-move /
# window-focus binds on b/f/p stay reachable (Ctrl+Shift=b/f/p collide).
map --allow-fallback=shifted,ascii ctrl+alt+n          scroll_line_down
map --allow-fallback=shifted,ascii ctrl+alt+p          scroll_line_up
map --allow-fallback=shifted,ascii ctrl+alt+f          scroll_page_down
map --allow-fallback=shifted,ascii ctrl+alt+b          scroll_page_up
map --allow-fallback=shifted,ascii ctrl+shift+home      scroll_home
map --allow-fallback=shifted,ascii ctrl+shift+end       scroll_end
# M-v: page backward (emacs)
map --allow-fallback=shifted,ascii alt+v                scroll_page_up

# NB: kitty has no inline comments — everything after an action is passed to it
# as arguments, so `map ... # note` would hand the note to the action (and
# `new_tab # note` would try to run the command "#"). Comments go above.
# kitty-scrollback.nvim kitten: alias -> real plugin .py; uses main ~/.config/nvim (has the plugin)
action_alias kitty_scrollback_nvim kitten ~/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py
# Browse scrollback buffer in nvim
map --allow-fallback=shifted,ascii kitty_mod+h kitty_scrollback_nvim
# Show clicked command output in nvim
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output
# Open file under cursor in Neovim
map --allow-fallback=shifted,ascii kitty_mod+o kitty_scrollback_nvim --env KSB_OPEN_GF=1
# Screen-only scrollback in Neovim (no history). Ctrl+Alt+S is the hint prefix
# above, so this moves one modifier up (kitty_mod+alt+s).
map --allow-fallback=shifted,ascii kitty_mod+alt+s kitty_scrollback_nvim --config screen

# The ru layout needs no duplicates here: the fallback option lets kitty
# match the base-layout key. Table and history: docs/howto/hotkeys-ru-layout.md
