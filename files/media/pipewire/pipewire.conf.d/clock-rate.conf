context.properties = {
    ## Configure properties in the system.
    #library.name.system                   = support/libspa-support
    #context.data-loop.library.name.system = support/libspa-support
    #support.dbus                          = true
    link.max-buffers                       = 16
    mem.warn-mlock                         = true
    mem.allow-mlock                        = true
    mem.mlock-all                          = true
    clock.power-of-two-quantum             = true
    log.level                              = 2
    cpu.zero.denormals                     = true

    core.daemon = true              # listening for socket connections
    core.name   = pipewire-0        # core name and socket name

    ## Properties for the DSP configuration.
    default.clock.rate           = 48000
    # Lock the graph to the RME's native 48 kHz. Carla (and other clients)
    # can otherwise pull the graph to 44.1 kHz, forcing the HDSPe to become a
    # resampling follower and xrun ("Broken pipe") — which glitches ALL audio.
    default.clock.allowed-rates  = [ 48000 ]
    # Match the RME HDSPe's fixed 256-frame period: a larger quantum makes
    # the device deliver 256-frame cycles that conflict with JACK clients'
    # buffers (Carla asserts: nframes 256 != bufferSize 1024).
    default.clock.quantum        = 256
    default.clock.min-quantum    = 64
    default.clock.max-quantum    = 4096
    #default.clock.quantum-limit = 8192
    default.clock.quantum-floor  = 16
    #default.video.width         = 640
    #default.video.height        = 480
    #default.video.rate.num      = 25
    #default.video.rate.denom    = 1
    #settings.check-quantum      = false
    #settings.check-rate         = false
    # enables autoloading of access module, when disabled an alternative
    # access module needs to be loaded.
    module.access = true
    # enables autoloading of module-jackdbus-detect
    module.jackdbus-detect = true
}
