# Virtual stereo sink for games that refuse to work with multi-channel
# pro-audio interfaces (Unity, FMOD, older SDL, etc.).
#
# This loopback creates actual playback ports (playback_FL / playback_FR)
# that can be routed to hardware via pw-link. The wp-hdspe-default systemd
# service handles the routing to RME AUX2/AUX3 (AES/EBU) with retries.
#
# No hardcoded target.object or node.target — the sink is created
# unconditionally at PipeWire start, and routing follows asynchronously
# when the hardware ALSA node becomes available.

context.modules = [
    {   name = libpipewire-module-loopback
        args = {
            capture.props = {
                media.class = Audio/Sink
                audio.position = [ FL FR ]
                node.name = game-stereo
                node.description = "Game Stereo"
                priority.session = 1200
            }
            playback.props = {
                node.name = "playback.game-stereo"
                # Stable description (default would be "loopback-<pid>-<serial>",
                # which changes every reboot and breaks patchbay rules that
                # match nodes by description).
                node.description = "Game Stereo Playback"
                audio.position = [ FL FR ]
                # The router owns this stream's destination (game-stereo ->
                # DSP/direct -> RME AES). This property states the intent but
                # does not enforce it: module-loopback connects its streams
                # with PW_STREAM_FLAG_AUTOCONNECT and the node still comes up
                # with node.autoconnect = true (measured 2026-11-13, when a USB
                # DAC was plugged in: WirePlumber's rescan fed the monitors'
                # mix into it). The routers prune that stray link — they are
                # the enforcement, not this line.
                node.autoconnect = false
            }
        }
    }
]
