# Virtual stereo sink for the headphone output.
#
# The headphone chain is a second, independent insert: nothing that is played
# here can reach the monitors, and nothing that is played to game-stereo can
# reach the headphones (the routers prune both directions). The chain is
#
#     apps -> headphones (sink) -> CamillaDSP (port 1235) -> E1DA USB DAC
#
# with a direct `playback.headphones -> E1DA` link as the fallback while the
# DSP is stopped (see modules/hardware/audio/dsp/route-headphones.sh).
#
# `node.autoconnect = false` on the playback stream is load-bearing: without it
# WirePlumber auto-links the stream to whatever sink is default at the moment,
# which would put headphone audio on the monitors (measured 2026-11-10 with a
# throwaway loopback: the graph came up with playback.game-stereo feeding the
# new sink and the new stream feeding the RME's analog pair). The router owns
# both ends of this insert.
#
# `priority.session = 1100` keeps the sink below game-stereo (1200), so the
# speakers stay the default output until the user chooses otherwise. It also
# keeps a freshly plugged USB DAC (usually 1000) from stealing the default away
# from the virtual sinks.
context.modules = [
    {   name = libpipewire-module-loopback
        args = {
            capture.props = {
                media.class = Audio/Sink
                audio.position = [ FL FR ]
                node.name = headphones
                node.description = "Headphones"
                priority.session = 1100
                node.autoconnect = false
            }
            playback.props = {
                node.name = "playback.headphones"
                node.description = "Headphones Playback"
                audio.position = [ FL FR ]
                node.autoconnect = false
            }
        }
    }
]
