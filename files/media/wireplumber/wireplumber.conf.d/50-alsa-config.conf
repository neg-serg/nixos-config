monitor.alsa.rules = [
  {
    # Questyle QCC Dongle Pro2 (Bluetooth transmitter, USB 0a12:4007).
    # udev's usb.ids database names this VID:PID "Mpow HC5 Headset in charging
    # mode" (0a12 is the CSR/Qualcomm vendor id), and that string is what the
    # ALSA monitor turns into device.description -> the card, sink and source
    # were all listed as some Mpow headset. The kernel/USB strings already say
    # "Questyle QCC Dongle Pro2", so make the graph agree.
    matches = [
      { alsa.card_name = "~QCC Dongle Pro2" }
    ]
    actions = {
      update-props = {
        device.description = "Questyle QCC Dongle Pro2"
        device.nick = "Questyle QCC Dongle Pro2"
        device.form-factor = "speaker"
        device.icon-name = "audio-card-usb"
        session.suspend-timeout-seconds = 0
      }
    }
  },
  {
    # ... and keep the two directions distinguishable in the UI
    matches = [ { node.name = "~alsa_output.usb-Questyle.*" } ]
    actions = {
      update-props = {
        node.description = "Questyle QCC Dongle Pro2"
        node.nick = "QCC Dongle Pro2 (BT)"
      }
    }
  },
  {
    matches = [ { node.name = "~alsa_input.usb-Questyle.*" } ]
    actions = {
      update-props = {
        node.description = "Questyle QCC Dongle Pro2 Mic"
        node.nick = "QCC Dongle Pro2 (mic)"
      }
    }
  },
  {
    # Disable suspend for all ALSA cards
    matches = [
      {
        device.name = "~alsa_card.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  },
  {
    # RME HDSPe AIO Pro: pro-audio profile for per-channel routing
    matches = [
      { alsa.card_name = "~RME AIO*" }
      { alsa.card_id = "~HDSPe*" }
    ]
    actions = {
      update-props = {
        device.profile = "pro-audio"
        api.alsa.period-size = 256
        # Wake margin, not buffer size: PipeWire wakes the sink with
        # quantum + headroom frames left (pull model), so 256 + 256 = 512
        # frames = 10.7 ms — the exact length of the appl_ptr stalls seen on
        # this card, which empty the ring and XRUN. 512 gives 768 frames =
        # 16 ms of margin; the graph stays at 256 frames (5.33 ms).
        api.alsa.headroom = 512
        api.alsa.disable-batch = true
        node.nick = "RME AIO Pro"
        priority.session = 0
        # priority.driver = 0 let the Dummy-Driver become the graph clock,
        # turning the RME into a resampling follower (period 256) that xruns
        # against the 1024 quantum ("Broken pipe") — glitching ALL audio when
        # a DSP client (Carla) is active. Make the HDSPe the clock driver.
        priority.driver = 1000
        session.suspend-timeout-seconds = 0
      }
    }
  }
  {
    # The RME capture PCM carries no clients, but the monitor default
    # (`node.pause-on-idle = false`) keeps it running. With nothing consuming
    # it the ALSA follower DLL has no stable delay to track: it wanders
    # (320..1616 frames) against a target of quantum + headroom = 768 frames,
    # so every correction logs "hw:0,0c: follower delay ... resync" and an
    # audioconvert "out of buffers", and the node's xrun counter climbs (847
    # on one boot). Headroom is a playback wake margin, so it does not belong
    # on the capture side either. Pause the node when nothing records from it —
    # a client that does will wake it as usual.
    matches = [ { node.name = "~alsa_input.pci-0000_05_00.0.pro-input-0" } ]
    actions = {
      update-props = {
        node.pause-on-idle = true
        api.alsa.headroom = 0
      }
    }
  }
]
