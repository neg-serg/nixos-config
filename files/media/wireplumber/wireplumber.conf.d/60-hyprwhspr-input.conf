# Dictation input for hyprwhspr-rs.
#
# hyprwhspr-rs opens ALSA "default", which follows the PipeWire default source
# — on this host that is the C920 webcam mic (default.configured.audio.source
# in ~/.local/state/wireplumber/default-nodes). The mic that matters is on the
# RME HDSPe AIO Pro, so route only the dictation stream there and leave the
# session default (calls, browser) untouched.
#
# The stream is the pipewire-alsa client named after the wrapped binary; it
# shows up as application.name "PipeWire ALSA [.hyprwhspr-rs-wrapped]" and
# node.name "alsa_capture..hyprwhspr-rs-wrapped" in pw-dump while recording.
stream.rules = [
  {
    matches = [
      { application.name = "~PipeWire ALSA.*hyprwhspr.*" }
    ]
    actions = {
      update-props = {
        target.object = "alsa_input.pci-0000_05_00.0.pro-input-0"
      }
    }
  }
]
