[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
  ".git",
  "files/kitty",       # vendored kitty kittens
  "files/art/fun-art", # ASCII-art scripts
  "nix",               # accidental nix store dump (gitignored)
]

[tool.black]
# NOTE: no `exclude` here — setting a custom `exclude` in pyproject makes
# black skip .gitignore entirely (only the *default* exclude enables gitignore
# handling). kitty/fun-art/nix are excluded via the Justfile `--extend-exclude`
# and .gitignore respectively.
line-length = 100
target-version = ['py310']
