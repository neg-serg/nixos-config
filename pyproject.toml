[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
  ".git",
  "files/kitty",         # vendored kitty kittens
  "files/art/fun-art",   # ASCII-art scripts
  "files/x11",           # vendored FVWM rice (files/x11/README.md)
  "files/x11/decay-gtk", # vendored GTK3 theme sources
  "nix",                 # accidental nix store dump (gitignored)
]

[tool.ruff.lint]
# Pin the classic default rule set (E4/E7/E9/F). Newer ruff versions enable
# many more rules by default (EXE, BLE, S, UP, RUF, ...), which would flag the
# whole Python corpus at once after a bump. Opt into additional rules
# explicitly when cleaning up a specific area.
select = ["E4", "E7", "E9", "F"]

[tool.black]
# NOTE: no `exclude` here — setting a custom `exclude` in pyproject makes
# black skip .gitignore entirely (only the *default* exclude enables gitignore
# handling). kitty/fun-art/nix are excluded via the Justfile `--extend-exclude`
# and .gitignore respectively.
line-length = 100
target-version = ['py310']
