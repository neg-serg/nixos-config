[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
  ".git",
  "files/kitty",       # vendored kitty kittens
  "files/art/fun-art", # ASCII-art scripts
]

[tool.black]
line-length = 100
target-version = ['py310']
exclude = '''
/(\
  \.git\
 | files/kitty\
 | files/art/fun-art\
)/
'''
